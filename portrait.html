
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait | Koichi Hayakawa Photography</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080808;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}
header {
  padding: 28px 5%;
  border-bottom: 1px solid #333;
}
header a {
  color: white;
  text-decoration: none;
}
main {
  max-width: 1100px;
  margin: auto;
  padding: 65px 25px;
}
h1 { text-align: center; font-size: 34px; }
.intro {
  text-align: center;
  color: #aaa;
  margin-bottom: 55px;
}
.gallery {
   display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}
.gallery-horizontal {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
  margin-top: 45px;
}figure img {
  display: block;
  width: 100%;
  height: auto;
}
figcaption {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-top: 12px;
}
footer {
  text-align: center;
  color: #888;
  padding: 45px 15px;
}
@media(max-width: 700px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
  .gallery-horizontal {
    grid-template-columns: 1fr;
  }
}
@media(max-width: 450px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header><a href="index.html">Koichi Hayakawa Photography</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#gallery">Gallery</a>
    <a href="portrait.html">Portrait</a>
    <a href="index.html#about">About</a>
    <a href="index.html#awards">Awards</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<main>
<h1>Portrait</h1>
<p class="intro">Bopiliao Historic Block, Taipei, Taiwan</p>

<section class="gallery">
  <figure>
    <img src="images/portrait/5W9A0958.JPG" alt="Portrait 1">
  </figure>
  <figure>
    <img src="images/portrait/5W9A1006-Edit.JPG" alt="Portrait 2">
  </figure>
  <figure>
    <img src="images/portrait/5W9A0992.JPG" alt="Portrait 3">
  </figure>
  <figure>
    <img src="images/portrait/5W9A0995-Edit-Edit-Edit.JPG" alt="Portrait 4">
  </figure>
</section>

<section class="gallery-horizontal">
  <figure>
    <img src="images/portrait/5W9A0988-Edit-2.JPG" alt="Portrait 5">
  </figure>
  <figure>
    <img src="images/portrait/5W9A1002.JPG" alt="Portrait 6">
  </figure>

<p class="intro" style="margin-top:55px">
Model: Xiaomi<br>
Photography: Koichi Hayakawa
</p>
</main>

<footer>© Koichi Hayakawa. All rights reserved.</footer>
<style>
.gallery img, .gallery-horizontal img {
  cursor: zoom-in;
  -webkit-user-drag: none;
  user-select: none;
}
@media print {
  .gallery, .gallery-horizontal, #photoLightbox {
    display: none !important;
  }
}
#photoLightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.95);
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#photoLightbox img {
  max-width: 95vw;
  max-height: 90vh;
  object-fit: contain;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  background: #080808;
}
header > a {
  font-size: 22px;
  font-weight: 600;
  white-space: nowrap;
}
header nav {
  display: flex;
  flex-wrap: wrap;
  gap: 28px;
}
header nav a {
  color: #ddd;
  text-decoration: none;
  font-size: 14px;
}
header nav a:hover {
  color: #fff;
}
@media (max-width: 700px) {
  header {
    flex-direction: column;
  }
  header nav {
    justify-content: center;
    gap: 14px;
  }
}
</style>


<div id="photoLightbox" role="dialog" aria-label="Photo viewer">
  <span id="photoClose" aria-label="Close" style="position:absolute;top:20px;right:30px;color:white;font-size:40px;cursor:pointer;line-height:1;">&times;</span>
  <img alt="Enlarged photograph">
</div>


<script>
const viewer = document.getElementById('photoLightbox');
const enlarged = viewer.querySelector('img');

document.querySelectorAll('.gallery img, .gallery-horizontal img')
  .forEach(img => {
    img.draggable = false;
    img.addEventListener('click', () => {
      enlarged.src = img.src;
      enlarged.alt = img.alt;
      viewer.style.display = 'flex';
    });
    img.addEventListener('contextmenu', e => e.preventDefault());
  });

viewer.addEventListener('click', () => {
  viewer.style.display = 'none';
  enlarged.removeAttribute('src');
});
viewer.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    viewer.style.display = 'none';
    enlarged.removeAttribute('src');
  }
});
</script>
</body>
</html>
