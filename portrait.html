
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait | Koichi Hayakawa Photography</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080808;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}
header {
  padding: 28px 5%;
  border-bottom: 1px solid #333;
}
header a {
  color: white;
  text-decoration: none;
}
main {
  max-width: 1100px;
  margin: auto;
  padding: 65px 25px;
}
h1 { text-align: center; font-size: 34px; }
.intro {
  text-align: center;
  color: #aaa;
  margin-bottom: 55px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px 22px;
}
figure { margin: 0; }
figure img {
  width: 100%;
  height: auto;
  display: block;
}
figcaption {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-top: 12px;
}
footer {
  text-align: center;
  color: #888;
  padding: 45px 15px;
}
@media(max-width: 700px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }
}
@media(max-width: 450px) {
  .gallery { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <a href="index.html">Koichi Hayakawa Photography</a>
</header>

<main>
<h1>Portrait</h1>
<p class="intro">Bopiliao Historic Block, Taipei, Taiwan</p>

<section class="gallery">
  <figure>
    <img src="images/portrait/5W9A0958.JPG" alt="Portrait 1" loading="lazy">
  </figure>
  <figure>
    <img src="images/portrait/5W9A1006-Edit.JPG" alt="Portrait 2" loading="lazy">
  </figure>
  <figure>
    <img src="images/portrait/5W9A0988-Edit-2.JPG" alt="Portrait 3" loading="lazy">
  </figure>
  <figure>
    <img src="images/portrait/5W9A0992.JPG" alt="Portrait 4" loading="lazy">
  </figure>
  <figure>
    <img src="images/portrait/5W9A1002.JPG" alt="Portrait 5" loading="lazy">
  </figure>
  <figure>
    <img src="images/portrait/5W9A0995-Edit-Edit-Edit.JPG" alt="Portrait 6" loading="lazy">
  </figure>
</section>

<p class="intro" style="margin-top:55px">
Model: Xiaomi<br>
Photography: Koichi Hayakawa
</p>
</main>

<footer>© Koichi Hayakawa. All rights reserved.</footer>
</body>
</html>
